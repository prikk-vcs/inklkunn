[package]
name = "inklkunn-signer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "inklkunn's signer: the per-wiki key store and the only path to prikk's write verbs (commit, seal, branch create). Nothing else reaches key material."

[features]
# The plain-text bootstrap signer (RFC 001 D-9): tests and a developer's first wiki only. A product binary
# never enables it; the boundary gate fails if one does.
bootstrap = []
# Knobs the crate's own tests turn (the cheapest key derivation). Never enabled by a product crate; the
# boundary gate fails if one does.
test-knobs = []

[dependencies]
inklkunn-prikk = { path = "../inklkunn-prikk", version = "0.0.0" }
# The validated identifiers (`WikiId`, `AccountId`, `ProposalId`) and `DisplayName`: what the signer may
# put in a path or a signed message is exactly what these types let through (both crates are lower-layer).
inklkunn-store = { path = "../inklkunn-store", version = "0.0.0" }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = "1"
# flock(2) for the key store and the per-wiki lock: std offers File::lock only from Rust 1.89, above the
# declared minimum (1.88). Already in the lock (via tempfile, dev-only); `fs` only, no libc backend needed.
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
inklkunn-signer = { path = ".", version = "0.0.0", features = ["bootstrap", "test-knobs"] }
proptest = { workspace = true }

[lints]
workspace = true
