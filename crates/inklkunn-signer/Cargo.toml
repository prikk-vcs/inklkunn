[package]
name = "inklkunn-signer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "inklkunn's signer: the per-wiki key store and the only path to prikk's write verbs (commit, seal, branch create). Nothing else reaches key material."

[features]
# The plain-text bootstrap signer (RFC 001 D-9): tests and a developer's first wiki only. A product binary
# never enables it; the boundary gate fails if one does.
bootstrap = []

[dependencies]
inklkunn-prikk = { path = "../inklkunn-prikk", version = "0.0.0" }
# The validated identifiers (`WikiId`, `AccountId`, `ProposalId`) and `DisplayName`: what the signer may
# put in a path or a signed message is exactly what these types let through (both crates are lower-layer).
inklkunn-store = { path = "../inklkunn-store", version = "0.0.0" }

[dev-dependencies]
inklkunn-signer = { path = ".", version = "0.0.0", features = ["bootstrap"] }
proptest = { workspace = true }

[lints]
workspace = true
