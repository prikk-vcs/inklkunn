[package]
name = "inklkunn-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "inklkunn's HTTP surface: the server-rendered UI, the read and write API, feeds, the message catalog, the sanitizer and the content origin."

[dependencies]
inklkunn-core = { workspace = true }
# The wiki record, its store and the validated slug: what a request resolves before it reads anything.
inklkunn-store = { workspace = true }
# The one percent-encoding of titles (the same function the renderer writes its links with).
inklkunn-markup = { workspace = true }
# The standard async web stack (RFC 003; measured in docs/dependency-policy.md). HTTP/1.1 only, behind the
# operator's TLS-terminating proxy; no JSON extractor and no WebSocket, no multipart: each is added by the task
# that needs it, with its own row.
axum = { version = "0.8", default-features = false, features = ["http1", "query", "form", "tokio"] }
# tokio 1.53.3 or later (RUSTSEC-2026-0386, `AsyncFd`; ledger PL-10): the lock holds 1.54.1.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
# The read API's JSON (handoff 003 T8): bodies are built as values and written by hand, so axum's `json` feature
# (an extractor and a responder this crate does not need) stays off. Already locked for the store and the driver.
serde_json = { workspace = true }
# Compiled, auto-escaping templates (RFC 003 D-5). Default features off on purpose: `config` (an `askama.toml`)
# pulls a TOML parser this project has no use for.
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
# The Service trait, to hand a request to one of two routers. Already locked as axum's own dependency.
tower-service = "0.3"

[dev-dependencies]
# Test-only: build account principals, to show a reader of a restricted wiki what an anonymous visitor is refused.
# (A dev-dependency feature: the boundary gate refuses it in a product dependency only.)
inklkunn-core = { workspace = true, features = ["test-authority"] }
# Test-only: the storage the page tests stand a repository on (an in-memory double of prikk's reads).
inklkunn-prikk = { workspace = true }
# Test-only: drive a router with `oneshot`, with no socket.
tower = { version = "0.5", features = ["util"] }
# Test-only: parse rendered pages for the structural checks (RFC 003 D-6). It is `ammonia`'s own parser, so
# nothing new enters the lock beyond it.
html5ever = "0.40"

[lints]
workspace = true
