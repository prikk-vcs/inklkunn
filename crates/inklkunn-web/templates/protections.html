{% if !protections.is_empty() %}<section class="protections" aria-labelledby="protections-heading">
<h2 id="protections-heading">{{ page.get(Key::ProtectionHeading) }}</h2>
<p class="note">{{ page.get(Key::ProtectionNote) }}</p>
<ul>
{% for p in protections %}<li><strong>{{ p.kind }}</strong> {{ p.on }} {{ p.requires }} {{ p.reason }}</li>
{% endfor %}</ul>
</section>
{% endif %}
