[package]
name = "inklkunn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "inklkunn's domain: wikis and views, pages, proposals and review, acceptance orchestration, the single default-deny authorize(), honesty, merge, export."

[dependencies]
inklkunn-markup = { path = "../inklkunn-markup", version = "0.0.0" }
inklkunn-prikk = { path = "../inklkunn-prikk", version = "0.0.0" }
inklkunn-signer = { path = "../inklkunn-signer", version = "0.0.0" }
inklkunn-store = { path = "../inklkunn-store", version = "0.0.0" }
# The sanitizer every rendered page passes through before a template sees it (RFC 003 D-3; threat model T-6).
ammonia = "4"

[dev-dependencies]
# The tests create wikis with the bootstrap signer and open the real signer with the cheapest key derivation;
# the product build never enables either feature.
inklkunn-signer = { path = "../inklkunn-signer", version = "0.0.0", features = ["bootstrap", "test-knobs"] }

[lints]
workspace = true
