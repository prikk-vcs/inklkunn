# RFC 010 D-10: a release is a bare-version tag plus attested artifacts. On a tag push the gates run on the
# tagged commit (the same two test runs as CI, prikk at the floor on PATH and shimmed off), the Linux
# binaries are built, the container image is built natively per architecture and joined under one tag by a
# manifest list, the tarballs and the image are attested, the GitHub release is created from the CHANGELOG
# section, and the crates are published in dependency order. The `rehearsal` dispatch mode exercises every
# step against a throwaway package (ghcr.io/prikk-vcs/inklkunn-rehearsal) and can never publish anything
# real (pin-check enforces the shape). The owner authorizes a release and the architect tags it (the project
# rules); the tag is signed by the owner's git configuration, and its signature is checked by readers, not here
# (docs/RELEASING.md; owner, 2026-10-29). Provenance for the artifacts is the attestations.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      mode:
        description: "rehearsal: build, attest and push only to the throwaway package; publish nothing real"
        required: true
        default: rehearsal
        type: choice
        options: [rehearsal]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PRIKK_VERSION: "0.54.0"
  PRIKK_SHA256_X86_64: "e998909328e4d1216c0e5ccf4b00141b32c6109498f04ba94a65cc61124ab687"
  PRIKK_SHA256_AARCH64: "9a325df0661c767ace382f0d7550a5a28ca9fd0a73bdf6f7878968133535df0d"
  EXPECTED_SKIPS: "57"
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.0
      - name: Tag equals the workspace version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          V="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "$TAG" = "$V" || { echo "tag $TAG != workspace version $V" >&2; exit 1; }
      - name: Install prikk at the floor (checksum recorded in this file) and the sandbox tools
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap util-linux
          T=x86_64-unknown-linux-gnu
          curl -fsSLO "https://github.com/prikk-vcs/prikk/releases/download/${PRIKK_VERSION}/prikk-${T}.tar.gz"
          echo "${PRIKK_SHA256_X86_64}  prikk-${T}.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf "prikk-${T}.tar.gz" -C "$HOME/.local/bin" prikk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/prikk" --version
      - name: Install cargo-deny and cargo-audit (pinned)
        run: cargo install cargo-deny@0.20.2 cargo-audit@0.22.2 --locked
      - name: Gates, with prikk on PATH
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo deny check
          cargo audit
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: Tests with prikk shimmed off PATH (every self-skip visible, and counted)
        run: |
          set -euo pipefail
          SHIM="$(mktemp -d)"
          for tool in cargo rustc rustdoc; do ln -s "$(rustup which "$tool")" "$SHIM/$tool"; done
          ln -s "$(command -v rustup)" "$SHIM/rustup"
          SYSTEM_PATH="$(echo "$PATH" | tr ':' '\n' | grep -v -x "$HOME/.local/bin" | paste -sd:)"
          ! PATH="$SHIM:$SYSTEM_PATH" command -v prikk >/dev/null || { echo "prikk is still on PATH"; exit 1; }
          PATH="$SHIM:$SYSTEM_PATH" cargo test --workspace --locked -- --nocapture 2>&1 | tee shimmed.log
          SKIPS="$(grep -c 'skipping: prikk not on PATH' shimmed.log || true)"
          test "$SKIPS" = "$EXPECTED_SKIPS" || { echo "expected $EXPECTED_SKIPS self-skip lines, saw $SKIPS"; exit 1; }

  binaries:
    needs: gates
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup default 1.99.0
      - name: Build
        env:
          INKLKUNN_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked -p inklkunn
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          NAME="inklkunn-${TARGET}"
          tar -C target/release -czf "dist/${NAME}.tar.gz" inklkunn
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          {
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF_NAME}"
            echo "toolchain: ${RUST_TOOLCHAIN} ($(rustc --version))"
            echo "requires: prikk >= ${PRIKK_VERSION}, bubblewrap, prlimit (util-linux)"
          } > "dist/${NAME}.build-info.txt"
      - name: Attest the tarball
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
          predicate-type: https://slsa.dev/provenance/v1
          predicate: '{"buildType":"https://github.com/prikk-vcs/inklkunn/release"}'
      - name: "Attest the tarball (rehearsal: the subject is renamed so the record is labelled)"
        if: inputs.mode == 'rehearsal'
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz; do cp "$f" "dist/rehearsal-$(basename "$f")"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  image:
    needs: binaries
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
      - name: Stage the binary for the image
        run: |
          set -euo pipefail
          mkdir -p "ctx/${ARCH}"
          tar -xzf "dist/inklkunn-${TARGET}.tar.gz" -C "ctx/${ARCH}" inklkunn
      - name: Log in to ghcr.io
        if: github.event_name == 'push' || inputs.mode == 'rehearsal'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push the image (tag push)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker build --build-arg "PRIKK_VERSION=${PRIKK_VERSION}" --build-arg "TARGETARCH=${ARCH}" \
            --build-arg "PRIKK_SHA256_X86_64=${PRIKK_SHA256_X86_64}" --build-arg "PRIKK_SHA256_AARCH64=${PRIKK_SHA256_AARCH64}" \
            -t "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}-${ARCH}" .
          docker push "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}-${ARCH}"
          docker buildx imagetools inspect "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}-${ARCH}" --format '{{json .Manifest.Digest}}' | tr -d '"' > image-digest.txt
          echo "digest=$(cat image-digest.txt)" >> "$GITHUB_OUTPUT"
        id: push
      - name: Attest the image (tag push)
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/prikk-vcs/inklkunn
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          predicate-type: https://slsa.dev/provenance/v1
          predicate: '{"buildType":"https://github.com/prikk-vcs/inklkunn/release"}'
      - name: "Build and push the image (rehearsal: the throwaway package only)"
        if: inputs.mode == 'rehearsal'
        run: |
          set -euo pipefail
          docker build --build-arg "PRIKK_VERSION=${PRIKK_VERSION}" --build-arg "TARGETARCH=${ARCH}" \
            --build-arg "PRIKK_SHA256_X86_64=${PRIKK_SHA256_X86_64}" --build-arg "PRIKK_SHA256_AARCH64=${PRIKK_SHA256_AARCH64}" \
            -t "ghcr.io/prikk-vcs/inklkunn-rehearsal:rehearsal-${ARCH}" .
          docker push "ghcr.io/prikk-vcs/inklkunn-rehearsal:rehearsal-${ARCH}"

  manifest:
    # One tag for both architectures, so `docker pull ghcr.io/prikk-vcs/inklkunn:X.Y.Z` works as the
    # release notes say.
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        if: github.event_name == 'push' || inputs.mode == 'rehearsal'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Join the per-architecture images under the release tag (tag push)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}" \
            "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}-amd64" "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}-arm64"
          docker buildx imagetools inspect "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}"
      - name: "Join the per-architecture images (rehearsal: the throwaway package only)"
        if: inputs.mode == 'rehearsal'
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "ghcr.io/prikk-vcs/inklkunn-rehearsal:rehearsal" \
            "ghcr.io/prikk-vcs/inklkunn-rehearsal:rehearsal-amd64" "ghcr.io/prikk-vcs/inklkunn-rehearsal:rehearsal-arm64"
          docker buildx imagetools inspect "ghcr.io/prikk-vcs/inklkunn-rehearsal:rehearsal"

  release:
    needs: manifest
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Release notes from the CHANGELOG section
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## \\[" tag "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "no CHANGELOG section for ${GITHUB_REF_NAME}" >&2; exit 1; }
          printf '\n---\n**Runtime prerequisites:** prikk >= %s, bubblewrap, prlimit (util-linux) on the host, or the container image `ghcr.io/prikk-vcs/inklkunn:%s` (amd64 and arm64).\n' "$PRIKK_VERSION" "$GITHUB_REF_NAME" >> release-notes.md
      - name: Create the GitHub release (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "inklkunn ${GITHUB_REF_NAME}" --notes-file release-notes.md

  crates:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup default 1.99.0
      - name: Publish the crates in dependency order (tag push; the token is the owner's, supplied as a secret)
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for c in inklkunn-markup inklkunn-prikk inklkunn-store inklkunn-signer inklkunn-auth inklkunn-core inklkunn-web inklkunn; do
            cargo publish --locked -p "$c"
          done
