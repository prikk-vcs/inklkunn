# RFC 010 D-10: a release is a bare-version tag plus attested artifacts. On a tag push the gates run on the
# tagged commit (the same two test runs as CI: prikk at the floor on PATH, with the test-only 0.58.0 beside it, and
# shimmed off), the Linux binaries are built, the container image is built natively per architecture and joined under one tag by a
# manifest list, the tarballs and the image are attested, the GitHub release is created from the CHANGELOG
# section, and the crates are published in dependency order. The `rehearsal` dispatch mode exercises every
# step against a throwaway package (ghcr.io/prikk-vcs/inklkunn-rehearsal) and can never publish anything
# real (pin-check enforces the shape). The owner authorizes a release and the architect tags it (the project
# rules); the tag is signed by the owner's git configuration, and its signature is checked by readers, not here
# (docs/RELEASING.md; owner, 2026-10-29). Provenance for the artifacts is the attestations.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      mode:
        description: "rehearsal: build, attest and push only to the throwaway package; publish nothing real"
        required: true
        default: rehearsal
        type: choice
        options: [rehearsal]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PRIKK_VERSION: "0.54.0"
  PRIKK_SHA256_X86_64: "e998909328e4d1216c0e5ccf4b00141b32c6109498f04ba94a65cc61124ab687"
  PRIKK_SHA256_AARCH64: "9a325df0661c767ace382f0d7550a5a28ca9fd0a73bdf6f7878968133535df0d"
  # The SECOND, test-only prikk (maintenance M25; one value with ci.yml, held by floor-check): never a floor, never in
  # the image. The tests of what 0.57.0 added run on the first prikk 0.57.0 or newer on PATH (the floor's *no verb*
  # answer on the first prikk on PATH), and print a guarded skip line when there is none; the gates fail on it.
  PRIKK_TEST_VERSION: "0.58.0"
  PRIKK_TEST_SHA256_X86_64: "0462b9a590d0b945bb6266ce09983055768cb564415837bdb8ed462b5aa10dfe"
  # The releases the upgrade tests start from (0.3.0 readiness R-3; 0.4.0 G-T1; held by floor-check): the 0.2.0 and the
  # 0.3.0 release binaries of this project, pinned release assets like the test-only prikk, the version spelled in each
  # variable's name. Each upgrade test has its binary make a data directory (a wiki, accounts, a key store, accepted
  # changes, an open proposal; 0.3.0's also a claim, a source, a curation, a thread comment and a view) and opens that
  # directory with this tree's server: 0.2.0's migrates store schema 15 to this tree's, 0.3.0's 18 to 19. Each binary is
  # on PATH in a directory of its own, for those tests only (a test looks for `inklkunn` there, and for its release by the
  # commit it was built from), and prints `skipping: inklkunn <version> not found` when there is none; the with-prikk run
  # fails on that line. The checksums are the ones GitHub's releases record for the assets and the releases' own `.sha256`
  # files say (0.2.0's measured 2026-11-18; 0.3.0's is the digest GitHub records for its asset, built from commit 599d4cd).
  UPGRADE_FROM_0_2_0_SHA256_X86_64: "e29814e026390ee8b46b744f862977efca53e5ec025af7ef8e11255b043bff86"
  UPGRADE_FROM_0_3_0_SHA256_X86_64: "b6f6726c2d2fd21c6b420dedab5b7ffb301afcf2f50946a5aed221c2feb84acb"
  EXPECTED_SKIPS: "380"
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.1
      - name: Tag equals the workspace version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          V="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "$TAG" = "$V" || { echo "tag $TAG != workspace version $V" >&2; exit 1; }
      - name: The release notes exist and fit a GitHub release (before anything is built or published)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          .github/release-notes.sh "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" > release-notes.md
          N="$(LC_ALL=C wc -c < release-notes.md)"
          test "$N" -le 100000 || { echo "the release notes are $N bytes; a GitHub release body holds at most 125,000 characters" >&2; exit 1; }
      - name: Install the test-only prikk (checksum recorded in this file), first, so that it comes after the floor on PATH
        run: |
          set -euo pipefail
          T=x86_64-unknown-linux-gnu
          curl -fsSL -o "prikk-test-${T}.tar.gz" "https://github.com/prikk-vcs/prikk/releases/download/${PRIKK_TEST_VERSION}/prikk-${T}.tar.gz"
          echo "${PRIKK_TEST_SHA256_X86_64}  prikk-test-${T}.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/prikk-test/bin" && tar -xzf "prikk-test-${T}.tar.gz" -C "$HOME/.local/prikk-test/bin" prikk
          test "$("$HOME/.local/prikk-test/bin/prikk" --version)" = "prikk ${PRIKK_TEST_VERSION}"
          echo "$HOME/.local/prikk-test/bin" >> "$GITHUB_PATH"
      - name: Install the 0.2.0 release the upgrade test starts from (checksum recorded in this file)
        run: |
          set -euo pipefail
          T=x86_64-unknown-linux-gnu
          curl -fsSL -o "inklkunn-0.2.0-${T}.tar.gz" "https://github.com/prikk-vcs/inklkunn/releases/download/0.2.0/inklkunn-${T}.tar.gz"
          echo "${UPGRADE_FROM_0_2_0_SHA256_X86_64}  inklkunn-0.2.0-${T}.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/inklkunn-0.2.0/bin" && tar -xzf "inklkunn-0.2.0-${T}.tar.gz" -C "$HOME/.local/inklkunn-0.2.0/bin" inklkunn
          V="$("$HOME/.local/inklkunn-0.2.0/bin/inklkunn" --version)"
          test "${V#inklkunn 0.2.0 (commit }" != "$V" || { echo "the asset is not inklkunn 0.2.0: $V" >&2; exit 1; }
          echo "$HOME/.local/inklkunn-0.2.0/bin" >> "$GITHUB_PATH"
      - name: Install the 0.3.0 release the upgrade test starts from (checksum recorded in this file)
        run: |
          set -euo pipefail
          T=x86_64-unknown-linux-gnu
          curl -fsSL -o "inklkunn-0.3.0-${T}.tar.gz" "https://github.com/prikk-vcs/inklkunn/releases/download/0.3.0/inklkunn-${T}.tar.gz"
          echo "${UPGRADE_FROM_0_3_0_SHA256_X86_64}  inklkunn-0.3.0-${T}.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/inklkunn-0.3.0/bin" && tar -xzf "inklkunn-0.3.0-${T}.tar.gz" -C "$HOME/.local/inklkunn-0.3.0/bin" inklkunn
          V="$("$HOME/.local/inklkunn-0.3.0/bin/inklkunn" --version)"
          test "${V#inklkunn 0.3.0 (commit }" != "$V" || { echo "the asset is not inklkunn 0.3.0: $V" >&2; exit 1; }
          echo "$HOME/.local/inklkunn-0.3.0/bin" >> "$GITHUB_PATH"
      - name: Install prikk at the floor (checksum recorded in this file) and the sandbox tools
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap util-linux
          T=x86_64-unknown-linux-gnu
          curl -fsSLO "https://github.com/prikk-vcs/prikk/releases/download/${PRIKK_VERSION}/prikk-${T}.tar.gz"
          echo "${PRIKK_SHA256_X86_64}  prikk-${T}.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf "prikk-${T}.tar.gz" -C "$HOME/.local/bin" prikk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/prikk" --version
      - name: Allow unprivileged user namespaces (the runner's AppArmor forbids them; bubblewrap and the PID-namespace test need them)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The floor is the first prikk on PATH and the test-only one is the second
        run: |
          set -euo pipefail
          # (`awk` drops a directory that PATH names twice, as the runner's own `~/.local/bin` entry and ours do.)
          test "$(type -ap prikk | awk '!seen[$0]++' | sed -n 1p)" = "$HOME/.local/bin/prikk"
          test "$(type -ap prikk | awk '!seen[$0]++' | sed -n 2p)" = "$HOME/.local/prikk-test/bin/prikk"
          test "$(prikk --version)" = "prikk ${PRIKK_VERSION}"
      - name: Install cargo-deny and cargo-audit (pinned)
        run: cargo install cargo-deny@0.20.2 cargo-audit@0.22.2 --locked
      - name: Gates, with prikk on PATH
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked --no-fail-fast -- --nocapture 2>&1 | tee with-prikk.log
          # None of the guarded skip lines may appear (the others, such as `/dev/shm`, `flock` and root-mode skips, are
          # host properties and not guarded): the test-only prikk and the floor are installed above, prikk is always on PATH here
          # (so `prikk not on PATH` can only be a silent skip), and bubblewrap works (installed and lifted above, and the
          # sandboxes take the host's own root layout, IS-19), so a confined test runs too.
          if grep -n -E 'skipping(: (prikk 0\.57\.0 or newer not found|no prikk older than 0\.57\.0|PID namespaces unavailable|prikk not on PATH|bubblewrap cannot confine|bwrap or curl not available|inklkunn 0\.2\.0 not found|inklkunn 0\.3\.0 not found)| the confined policy)' with-prikk.log; then
            echo "a test skipped that must run here: the test-only prikk ${PRIKK_TEST_VERSION} (or the floor beside it), the releases the upgrade tests start from (0.2.0 and 0.3.0), prikk itself, the PID-namespace test and bubblewrap are all installed or lifted above (a bubblewrap line carries bubblewrap's own reason)" >&2
            exit 1
          fi
          cargo deny check
          cargo audit
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: Tests with prikk shimmed off PATH (every self-skip visible, and counted)
        run: |
          set -euo pipefail
          SHIM="$(mktemp -d)"
          for tool in cargo rustc rustdoc; do ln -s "$(rustup which "$tool")" "$SHIM/$tool"; done
          ln -s "$(command -v rustup)" "$SHIM/rustup"
          SYSTEM_PATH="$(echo "$PATH" | tr ':' '\n' | grep -v -x -e "$HOME/.local/bin" -e "$HOME/.local/prikk-test/bin" | paste -sd:)"
          ! PATH="$SHIM:$SYSTEM_PATH" command -v prikk >/dev/null || { echo "prikk is still on PATH"; exit 1; }
          PATH="$SHIM:$SYSTEM_PATH" cargo test --workspace --locked --no-fail-fast -- --nocapture 2>&1 | tee shimmed.log
          SKIPS="$(grep -c 'skipping: prikk not on PATH' shimmed.log || true)"
          test "$SKIPS" = "$EXPECTED_SKIPS" || { echo "expected $EXPECTED_SKIPS self-skip lines, saw $SKIPS"; exit 1; }

  binaries:
    needs: gates
    strategy:
      matrix:
        # Built on Ubuntu 22.04 (glibc 2.35) so the binary runs on the image's Debian 12 base (glibc 2.36) and on
        # every distribution with glibc 2.35 or newer; 24.04's headers make the C parts (AWS-LC, SQLite) need 2.38+.
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.1
      - name: Build
        env:
          INKLKUNN_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked -p inklkunn
      - name: The binary needs no glibc newer than 2.35 (the image's base has 2.36)
        run: |
          set -euo pipefail
          NEED="$(objdump -T target/release/inklkunn | grep -o 'GLIBC_[0-9.]*' | cut -d_ -f2 | sort -uV | tail -1)"
          echo "the binary needs glibc ${NEED}"
          test "$(printf '%s\n' "${NEED}" 2.35 | sort -V | tail -1)" = 2.35 || { echo "the binary needs glibc ${NEED}, newer than 2.35" >&2; exit 1; }
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          NAME="inklkunn-${TARGET}"
          tar -C target/release -czf "dist/${NAME}.tar.gz" inklkunn
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          {
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF_NAME}"
            echo "toolchain: ${RUST_TOOLCHAIN} ($(rustc --version))"
            echo "requires: glibc >= 2.35, prikk >= ${PRIKK_VERSION}, bubblewrap, prlimit (util-linux)"
          } > "dist/${NAME}.build-info.txt"
      - name: Attest the tarball
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: "Attest the tarball (rehearsal: the subject is renamed so the record is labelled)"
        if: inputs.mode == 'rehearsal'
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz; do cp "$f" "dist/rehearsal-$(basename "$f")"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  image:
    needs: binaries
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
      - name: Stage the binary for the image
        run: |
          set -euo pipefail
          mkdir -p "ctx/${ARCH}"
          tar -xzf "dist/inklkunn-${TARGET}.tar.gz" -C "ctx/${ARCH}" inklkunn
      - name: Log in to ghcr.io
        if: github.event_name == 'push' || inputs.mode == 'rehearsal'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build the image (one local tag; the two push steps below tag it)
        run: |
          set -euo pipefail
          docker build --build-arg "PRIKK_VERSION=${PRIKK_VERSION}" --build-arg "TARGETARCH=${ARCH}" \
            --build-arg "PRIKK_SHA256_X86_64=${PRIKK_SHA256_X86_64}" --build-arg "PRIKK_SHA256_AARCH64=${PRIKK_SHA256_AARCH64}" \
            --build-arg "DOCUMENTATION_URL=https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/SECURITY.md#what-a-host-needs-for-confinement" \
            -t "inklkunn-built:${ARCH}" .
      - name: Allow unprivileged user namespaces (the runner's AppArmor forbids them; bubblewrap in the image needs them)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The built image confines prikk (IS-19; before anything is pushed)
        # `wiki create` on a scratch volume is a command that cannot succeed unless bubblewrap confines prikk in the image: it
        # probes bubblewrap first and refuses to run prikk unconfined (there is no `--dev-unconfined` here). The three
        # `--security-opt` settings are what docker needs to let bubblewrap make its namespaces and mount `/proc` in a
        # container (docs: SECURITY.md, "What a host needs for confinement"). The second line of options is what an operator
        # adds back beside them (no capabilities, no new privileges, a read-only root with a tmpfs for the scratch secret);
        # measured under podman (M49), and what is documented there is what runs here. Any failure fails the job, with
        # bubblewrap's reason.
        run: |
          set -euo pipefail
          OUT="$(docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp \
            -v "inklkunn-confine-check-${ARCH}:/var/lib/inklkunn" \
            -e INKLKUNN_DATA_DIR=/var/lib/inklkunn/data -e INKLKUNN_SECRET_FILE=/tmp/secret \
            --entrypoint /bin/sh "inklkunn-built:${ARCH}" -c \
            'set -eu; head -c 32 /dev/urandom | od -An -tx1 | tr -d " \n" > /tmp/secret; chmod 600 /tmp/secret; exec /usr/local/bin/inklkunn wiki create confine-check --name "Confine check"' 2>&1)" || { echo "$OUT" >&2; echo "the built image could not confine prikk (bubblewrap's reason is above)" >&2; exit 1; }
          echo "$OUT"
          echo "$OUT" | grep -q '^created wiki confine-check ' || { echo "the built image did not create the wiki" >&2; exit 1; }
      - name: Push the image (tag push)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker tag "inklkunn-built:${ARCH}" "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}-${ARCH}"
          docker push "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}-${ARCH}"
          docker buildx imagetools inspect "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}-${ARCH}" --format '{{json .Manifest.Digest}}' | tr -d '"' > image-digest.txt
          echo "digest=$(cat image-digest.txt)" >> "$GITHUB_OUTPUT"
        id: push
      - name: Attest the image (tag push)
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/prikk-vcs/inklkunn
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: "Push the image (rehearsal: the throwaway package only)"
        if: inputs.mode == 'rehearsal'
        run: |
          set -euo pipefail
          docker tag "inklkunn-built:${ARCH}" "ghcr.io/prikk-vcs/inklkunn-rehearsal:rehearsal-${ARCH}"
          docker push "ghcr.io/prikk-vcs/inklkunn-rehearsal:rehearsal-${ARCH}"

  manifest:
    # One tag for both architectures, so `docker pull ghcr.io/prikk-vcs/inklkunn:X.Y.Z` works as the
    # release notes say.
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Log in to ghcr.io
        if: github.event_name == 'push' || inputs.mode == 'rehearsal'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Join the per-architecture images under the release tag (tag push)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}" \
            "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}-amd64" "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}-arm64"
          docker buildx imagetools inspect "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}"
          docker buildx imagetools inspect "ghcr.io/prikk-vcs/inklkunn:${GITHUB_REF_NAME}" --format '{{json .Manifest.Digest}}' | tr -d '"' > image-digest.txt
          echo "digest=$(cat image-digest.txt)" >> "$GITHUB_OUTPUT"
        id: join
      - name: Attest the joined image tag (tag push; the subject is the manifest list's digest)
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/prikk-vcs/inklkunn
          subject-digest: ${{ steps.join.outputs.digest }}
          push-to-registry: true
      - name: "Join the per-architecture images (rehearsal: the throwaway package only)"
        if: inputs.mode == 'rehearsal'
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "ghcr.io/prikk-vcs/inklkunn-rehearsal:rehearsal" \
            "ghcr.io/prikk-vcs/inklkunn-rehearsal:rehearsal-amd64" "ghcr.io/prikk-vcs/inklkunn-rehearsal:rehearsal-arm64"
          docker buildx imagetools inspect "ghcr.io/prikk-vcs/inklkunn-rehearsal:rehearsal"
          docker buildx imagetools inspect "ghcr.io/prikk-vcs/inklkunn-rehearsal:rehearsal" --format '{{json .Manifest.Digest}}' | tr -d '"' > image-digest.txt
          echo "digest=$(cat image-digest.txt)" >> "$GITHUB_OUTPUT"
        id: join_rehearsal
      - name: "Attest the joined image (rehearsal: the throwaway package only, so the first tag run is not this step's first run)"
        if: inputs.mode == 'rehearsal'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/prikk-vcs/inklkunn-rehearsal
          subject-digest: ${{ steps.join_rehearsal.outputs.digest }}
          push-to-registry: true

  release:
    needs: manifest
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Release notes from the CHANGELOG section
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          .github/release-notes.sh "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" > release-notes.md
          printf '\n---\n**Runtime prerequisites:** Linux with glibc >= 2.35, prikk >= %s, bubblewrap, prlimit (util-linux) on the host, or the container image `ghcr.io/prikk-vcs/inklkunn:%s` (amd64 and arm64). What the host (or the container) must allow for bubblewrap to confine prikk: [SECURITY.md, *What a host needs for confinement*](https://github.com/%s/blob/%s/SECURITY.md#what-a-host-needs-for-confinement).\n' "$PRIKK_VERSION" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md
      - name: Create the GitHub release (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file release-notes.md

  crates:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.1
      - name: Publish the crates in dependency order (tag push; the token is the owner's, supplied as a secret)
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # crates.io is optional per release (owner, 2026-10-31): with no token the release ships without it.
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::notice::no CARGO_REGISTRY_TOKEN secret: the crates are not published to crates.io for ${GITHUB_REF_NAME}"
            exit 0
          fi
          for c in inklkunn-markup inklkunn-prikk inklkunn-fetch inklkunn-store inklkunn-signer inklkunn-auth inklkunn-core inklkunn-web inklkunn; do
            cargo publish --locked -p "$c"
          done
