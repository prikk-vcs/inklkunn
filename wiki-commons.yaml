# inklkunn's self-assessment against the Wiki Commons conformance profiles
# (wiki-commons guidelines/16-Conformance_Profiles_and_Self_Assessment.md, schemas/self-assessment.schema.json), profiles at 0.4.
#
# How to read it. An item is "yes" only where a named test shows it: the note says which, as <file>::<test>, with the file's
# path from the repository root, so that a claim is checked in one lookup. A "partial", "no" or "n/a" item gives its reason.
# crates/inklkunn-core/tests/self_assessment.rs reads this file and fails on a "yes" with no test named, on a test that does not
# exist, on a status that is not one of the schema's, on an unquoted yes or no (YAML reads those as booleans), on a profile
# whose items are not the ones chapter 16 lists, and on a profile claim that says more than its items. Some named tests need
# a real prikk on PATH (they print a skip line without one); the release workflow's tests run with it.
#
# Where a thing is not done, the note says so in the reader's words. To report a discrepancy: open an issue in the repository.
format: wiki-commons-self-assessment
